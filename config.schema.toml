# Schema for GetQuotes configuration
# This schema follows the Taplo schema format, based on JSON Schema

"$schema" = "https://json-schema.org/draft-07/schema"
title = "GetQuotes Configuration"
description = "Configuration settings for the GetQuotes application."
type = "object"

[properties]
[properties.authors]
type = "array"
description = "List of authors to fetch quotes from."
minItems = 1

[[properties.authors.examples]]
["Albert Einstein", "Isaac Newton"]

[properties.authors.items]
type = "string"
description = "Name of an author."

[properties.theme_color]
type = "string"
description = "Base quote color. Supports hex, rgb(...), rgba(...), hsl(...), and CSS-inspired gradients such as linear-gradient(...), radial-gradient(...), conic-gradient(...), and repeating variants."

[[properties.theme_color.examples]]
"#FF5733"

[[properties.theme_color.examples]]
"FF5733"

[[properties.theme_color.examples]]
"rgb(255, 87, 51)"

[[properties.theme_color.examples]]
"hsl(12, 100%, 60%)"

[[properties.theme_color.examples]]
"linear-gradient(#FF5733, rgb(255, 200, 0), #00AAFF)"

[[properties.theme_color.examples]]
"radial-gradient(circle at center, #FF5733 0%, rgb(255, 200, 0) 50%, #00AAFF 100%)"

[[properties.theme_color.examples]]
"conic-gradient(from 90deg, #FF5733, rgb(255, 200, 0), #00AAFF)"

[properties.quote_style]
type = "string"
description = "Comma-separated style tokens for quote text, such as bold, italic, underline, strikethrough, colors, or gradients."
default = "bold"

[[properties.quote_style.examples]]
"bold"

[[properties.quote_style.examples]]
"bold,italic,hsl(200, 100%, 50%)"

[properties.author_style]
type = "string"
description = "Comma-separated style tokens for the author text."
default = "green"

[[properties.author_style.examples]]
"green"

[[properties.author_style.examples]]
"bold,linear-gradient(#00ff00, #0000ff)"

[properties.nested_quote_style]
type = "string"
description = "Optional style tokens applied to quotes that appear inside the main quote text."
default = ""

[[properties.nested_quote_style.examples]]
"underline"

[properties.max_tries]
type = "integer"
description = "Maximum number of attempts to find a quote."
minimum = 1
maximum = 100
default = 30

[[properties.max_tries.examples]]
10

[[properties.max_tries.examples]]
50

[properties.log_file]
type = "string"
description = "Path to the log file."
default = "getquotes.log"

[[properties.log_file.examples]]
"logs/app.log"

[[properties.log_file.examples]]
"/var/log/getquotes.log"

[properties.rainbow_mode]
type = "boolean"
description = "Enable rainbow mode for a true rainbow quote gradient."
default = false

[[properties.rainbow_mode.examples]]
true

[[properties.rainbow_mode.examples]]
false

[properties.layout]
type = "string"
description = "Output layout."
default = "default"
enum = ["default", "box"]

[[properties.layout.examples]]
"default"

[[properties.layout.examples]]
"box"

[properties.box_corners]
type = "string"
description = "Box corner style when layout is set to box."
default = "pointy"
enum = ["pointy", "rounded"]

[[properties.box_corners.examples]]
"pointy"

[[properties.box_corners.examples]]
"rounded"

required = ["authors", "theme_color"]
additionalProperties = false
