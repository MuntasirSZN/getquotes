name: 🏗️ Build For Linux
on:
  workflow_call:
jobs:
  build-linux:
    name: 🐧 Build Linux For ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - name: 🔍 Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⚙️ Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: 🛠️ Build Release Binary
        run: cargo build --target ${{ matrix.target }} --release
      - name: 📦 Package Artifacts (tar.gz)
        shell: bash
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/getquotes release/
          tar -czvf getquotes-${{ matrix.target }}.tar.gz -C release getquotes -C ../ man/getquotes.1 LICENSE completions/ config.schema.json
      - name: 🚢 Upload Linux Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.target }}
          path: getquotes-${{ matrix.target }}.tar.gz
